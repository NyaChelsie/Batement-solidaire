<script>
    export default {

            return {

                },
                showpassword: 'true',
            }
        },
        props: [
            'utilisateurs'
        ],
        methods: {
            connexion() {
                let state = false
                this.utilisateurs.forEach(user => {
                    if (this.user.Email == user.email && this.user.password == user.password) {

                        state = true
                    }
                });

                if (state) {
                    this.$emit('connexion2')
                }
                else {

                }

            }

        }
    }
